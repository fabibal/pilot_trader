services:
  pilot_trader_dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: pilot-trader-dashboard:latest
    container_name: pilot_trader_dashboard
    restart: unless-stopped

    # Host networking is REQUIRED for the IBKR Paper Portfolio tab: IB Gateway
    # listens on the host's 127.0.0.1:4002 and only trusts loopback
    # (jts.ini TrustedIPs=127.0.0.1), so a bridge-networked container (different
    # source IP) is rejected. With host mode the container shares the host net
    # namespace -> connects as 127.0.0.1 -> trusted. `ports:` is incompatible
    # with host mode (and unnecessary): dashboard.py binds 0.0.0.0:8051 directly
    # on the host, so it's still LAN-reachable at e.g. <LAN_IP>:8051.
    network_mode: host

    environment:
      - TZ=UTC
      - PYTHONUNBUFFERED=1

    volumes:
      # Bind-mount the host project so trades.json / monitor.py / dashboard.py
      # are live inside the container at the path the app expects.
      - .:/home/fbazsa/pilot_trader
      # Docker socket for the system-status bar: per-container CPU/RAM stats.
      # The dashboard only ever issues GET requests against it (no restart
      # button here — that's ~/paper_trader's dashboard).
      # ⚠️ SECURITY: the mount still grants full Docker-daemon control, which
      # is root-equivalent on the host (any process in the container could
      # start a privileged container). A `:ro` mount would NOT mitigate it
      # (connecting to a unix socket needs write permission, so :ro just
      # breaks the stats too) and a socket proxy is overkill here.
      # Accepted because: dashboard is LAN-only (no port forwarding), paper
      # account only, and the container runs only our own code (bind-mounted
      # repo). Revisit before any WAN exposure.
      - /var/run/docker.sock:/var/run/docker.sock

    deploy:
      resources:
        limits:
          cpus: "0.5"
          # 512M (was 384M): ib_insync + an IB API connection per refresh +
          # the background price-cache warmer; 384M ran ~91% full (OOM risk).
          memory: 512M

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Dash serves "/" with HTTP 200 once up.
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request, sys;\nsys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8051/', timeout=5).status == 200 else 1)"]
      interval: 1h
      timeout: 10s
      retries: 3
      start_period: 60s
