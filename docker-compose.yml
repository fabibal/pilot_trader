services:
  pilot_trader_dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: pilot-trader-dashboard:latest
    container_name: pilot_trader_dashboard
    restart: unless-stopped
    # Match fbazsa, who owns the atomically written mode-0600 data files.
    # Root with all capabilities dropped cannot bypass their permissions.
    user: "1000:1000"

    # Host networking: originally REQUIRED for the IBKR Paper Portfolio tab (IB
    # Gateway only trusts loopback, so a bridge-networked container's different
    # source IP was rejected). That integration was retired 2026-08-27 (see
    # CLAUDE.md "IBKR mirror (retired)") — this dashboard no longer talks to IB
    # Gateway at all, so host mode is no longer strictly required. Left as-is
    # rather than switching to bridge + `ports:`, since that also means
    # re-plumbing the NPM/ufw setup documented in CLAUDE.md; revisit if anyone
    # wants to simplify it deliberately. `ports:` stays incompatible with host
    # mode (and unnecessary): dashboard.py binds 0.0.0.0:8051 directly on the
    # host, so it's still reachable at e.g. <LAN_IP>:8051.
    network_mode: host

    environment:
      - TZ=UTC
      - PYTHONUNBUFFERED=1
      # Compose reads this one credential from .env; the app needs only credits.
      - GETXAPI_KEY=${GETXAPI_KEY:-}

    volumes:
      # Bind-mount the host project so trades.json / monitor.py / dashboard.py
      # are live inside the container at the path the app expects.
      # Read-only: a dashboard compromise must not rewrite source or ledgers.
      - .:/home/fbazsa/pilot_trader:ro
      # Hide unneeded API secrets in the host .env from the dashboard.
      - /dev/null:/home/fbazsa/pilot_trader/.env:ro
      # No Docker socket: status stats gracefully report unavailable.

    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    deploy:
      resources:
        limits:
          cpus: "0.5"
          # 512M (was 384M): originally ib_insync + an IB API connection per
          # refresh + the background price-cache warmer; 384M ran ~91% full
          # (OOM risk). The IBKR piece is gone (2026-08-27), but left at 512M
          # rather than reverting unmeasured — the price-cache warmer alone
          # was never isolated from the old figure.
          memory: 512M

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Dash serves "/" with HTTP 200 once up.
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request, sys;\nsys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8051/', timeout=5).status == 200 else 1)"]
      interval: 1h
      timeout: 10s
      retries: 3
      start_period: 60s
